apiVersion: scheduling.demo.ngg.io/v1alpha1
kind: NodeGroupDemand
metadata:
  name: batch
  namespace: ngd-ngg-demo
spec:
  taskRef:
    apiVersion: batch.volcano.sh/v1alpha1
    kind: Job
    name: ngg-batch
  schedulerName: volcano
  workloadClass: batch
  podSets:
  - name: worker
    replicas: 2
    minAvailable: 2
    resourcesPerPod:
      cpu: "100m"
      memory: "64Mi"
  nodeRequirements:
    nodeSelector:
      demo.ngg/partition: batch
  candidatePolicy:
    maxNodes: 1
    grantTTLSeconds: 600

