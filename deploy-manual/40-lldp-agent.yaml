apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lldp-agent
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ngd-ngg-lldp-agent
  template:
    metadata:
      labels:
        app: ngd-ngg-lldp-agent
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: virtual-kubelet.io/provider
          operator: Equal
          value: dubhe
          effect: NoSchedule
      containers:
        - name: lldp-agent
          image: ghwdsl/ngd-ngg-scheduling:lldp-v0.6.2
          imagePullPolicy: IfNotPresent
          args:
            - --timeout=65s
            - --count=0
            - --interval=180s
            - --sys-class-net=/host-sys/class/net
            - --interfaces=bond0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBECONFIG
              value: /etc/ngd-ngg/auth/kubeconfig
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
            - name: kubeconfig
              mountPath: /etc/ngd-ngg/auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: kubeconfig
          secret:
            secretName: lldp-kubeconfig
            defaultMode: 0440
            items:
              - key: kubeconfig
                path: kubeconfig
