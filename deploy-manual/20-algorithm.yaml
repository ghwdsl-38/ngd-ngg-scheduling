apiVersion: v1
kind: Service
metadata:
  name: ngd-ngg-algorithm
spec:
  selector:
    app: ngd-ngg-algorithm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngd-ngg-algorithm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ngd-ngg-algorithm
  template:
    metadata:
      labels:
        app: ngd-ngg-algorithm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: algorithm
          image: ghwdsl/ngd-ngg-scheduling:algorithm-v0.6.1
          imagePullPolicy: IfNotPresent
          env:
            # 修改为Algorithm Pod能够访问的真实Prometheus地址。
            - name: PROMETHEUS_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090
            - name: PROMETHEUS_REFRESH_SECONDS
              value: "15"
            - name: PROMETHEUS_STALE_SECONDS
              value: "120"
            - name: PROMETHEUS_REQUEST_TIMEOUT_SECONDS
              value: "5"
            - name: PROMETHEUS_NODE_LABEL
              value: node
            - name: PROMETHEUS_TLS_SERVER_NAME
              value: ""
            - name: TOPOLOGY_CONFIG_FILE
              value: /etc/ngd-ngg/topology/topology.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: topology
              mountPath: /etc/ngd-ngg/topology
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: topology
          configMap:
            name: ngd-ngg-algorithm-topology

