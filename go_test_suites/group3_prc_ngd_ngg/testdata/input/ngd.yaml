apiVersion: scheduling.platform.example.io/v1alpha1
kind: NodeGroupDemand
metadata:
  labels:
    scheduling.platform.example.io/scheduler: volcano
  name: go-test-demand
spec:
  maxNodes: 18
  minResources:
    cpu: "480"
    memory: 1920Gi
  nodeSelector:
    matchLabels:
      tests.ngg.io/worker: "true"
  quota:
    cpu: "576"
    memory: 2304Gi
  schedulerName: volcano
