apiVersion: scheduling.platform.example.io/v1alpha1
kind: NodeGroupDemand
metadata:
  name: demand-3000-normal
spec:
  schedulerName: volcano
  nodeSelector:
    matchLabels:
      tests.ngg.io/worker: "true"
  # NarrowestFit从Leaf开始逐层扩大；coreSwitch表示最多允许放宽到Core层。
  topologyRequirement:
    profile: leaf-border-core-v1
    strategy: NarrowestFit
    widestAllowedLevel: coreSwitch
  maxCandidateGroups: 3
  maxNodes: 1000
  quota:
    cpu: "1200"
    memory: 4800Gi
  minResources:
    cpu: "1000"
    memory: 1000Gi
  # 以下正式字段需要后续算法能力；当前测试确认PRC原样透传、Algorithm明确告警，
  # 但它们不参与本阶段候选组计算。
  minThroughput: 5Gbps
  crossClusterAffinity:
    ipList: [10.0.2.15]
    enforce: true
  intraClusterAffinity:
    ipList: [10.0.1.20]
  networkReachability:
    targets: [ozone, shuffle]
  preferredSubnet: subnet-test-a
