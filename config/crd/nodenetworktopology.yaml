apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodenetworktopologies.scheduling.demo.ngg.io
spec:
  group: scheduling.demo.ngg.io
  scope: Cluster
  names:
    plural: nodenetworktopologies
    singular: nodenetworktopology
    kind: NodeNetworkTopology
    shortNames: [nnt]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Node
      type: string
      jsonPath: .spec.nodeRef.name
    - name: Switch
      type: string
      jsonPath: .status.switchId
    - name: Bandwidth
      type: number
      jsonPath: .status.bandwidthGbps
    - name: Latency
      type: number
      jsonPath: .status.latencyMillis
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [nodeRef, collectionMode]
            properties:
              nodeRef:
                type: object
                required: [name, uid]
                properties:
                  name: {type: string, minLength: 1}
                  uid: {type: string, minLength: 1}
              collectionMode:
                type: string
                enum: [Simulated, LLDP]
          status:
            type: object
            properties:
              switchId: {type: string}
              coreSwitchId: {type: string}
              bandwidthGbps: {type: number, minimum: 0}
              latencyMillis: {type: number, minimum: 0}
              topologyVersion: {type: string}
              observedAt: {type: string, format: date-time}
              source:
                type: string
                enum: [SimulatedLLDP, LLDP]
              localInterface: {type: string}
              remotePortId: {type: string}
              agentVersion: {type: string}
