apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodegroupgrants.scheduling.demo.ngg.io
spec:
  group: scheduling.demo.ngg.io
  scope: Namespaced
  names:
    plural: nodegroupgrants
    singular: nodegroupgrant
    kind: NodeGroupGrant
    shortNames: [ngg]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: GroupState
      type: string
      jsonPath: .status.activeGroupState
    - name: Rank
      type: integer
      jsonPath: .spec.activeGroupRef.rank
    - name: Group
      type: string
      jsonPath: .spec.activeGroupRef.groupId
    - name: Revision
      type: integer
      jsonPath: .spec.revision
    - name: ValidUntil
      type: string
      jsonPath: .spec.validUntil
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required:
            - demandRef
            - taskRef
            - schedulerName
            - candidateNodeGroups
            - groupAttemptPolicy
            - dataVersions
            - revision
            - generatedAt
            - validUntil
            - source
            properties:
              demandRef:
                type: object
                required: [name, uid, generation]
                properties:
                  name: {type: string, minLength: 1}
                  uid: {type: string, minLength: 1}
                  generation: {type: integer, format: int64, minimum: 1}
              taskRef:
                type: object
                required: [apiVersion, kind, name, uid]
                properties:
                  apiVersion: {type: string, minLength: 1}
                  kind: {type: string, minLength: 1}
                  name: {type: string, minLength: 1}
                  uid: {type: string, minLength: 1}
              schedulerName:
                type: string
                enum: [volcano, default-scheduler, ngg-scheduler]
              candidateNodeGroups:
                type: array
                maxItems: 3
                items:
                  type: object
                  required: [rank, groupId, topologyLevel, groupScore, nodes]
                  properties:
                    rank: {type: integer, format: int32, minimum: 1, maximum: 3}
                    groupId: {type: string, minLength: 1}
                    topologyLevel: {type: string, enum: [leafGroup]}
                    groupScore: {type: number, minimum: 0, maximum: 100}
                    nodes:
                      type: array
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, uid, score]
                        properties:
                          name: {type: string, minLength: 1}
                          uid: {type: string, minLength: 1}
                          score: {type: integer, format: int32, minimum: 0, maximum: 100}
              activeGroupRef:
                type: object
                required: [rank, groupId]
                properties:
                  rank: {type: integer, format: int32, minimum: 1, maximum: 3}
                  groupId: {type: string, minLength: 1}
              groupAttemptPolicy:
                type: object
                required: [timeoutSeconds, lockAfterFirstBind]
                properties:
                  timeoutSeconds: {type: integer, format: int32, minimum: 5, maximum: 600}
                  lockAfterFirstBind: {type: boolean, enum: [true]}
              dataVersions:
                type: object
                required:
                - algorithmBootId
                - nodeStaticSnapshotId
                - schedulerStateSnapshotId
                - metricSnapshotId
                properties:
                  algorithmBootId: {type: string, minLength: 1}
                  nodeStaticSnapshotId: {type: string, minLength: 1}
                  schedulerStateSnapshotId: {type: string, minLength: 1}
                  metricSnapshotId: {type: string, minLength: 1}
              revision: {type: integer, format: int64, minimum: 1}
              generatedAt: {type: string, format: date-time}
              validUntil: {type: string, format: date-time}
              source: {type: string, enum: [prc-algorithm]}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
