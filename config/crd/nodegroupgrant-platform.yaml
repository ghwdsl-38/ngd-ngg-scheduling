apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodegroupgrants.scheduling.platform.example.io
spec:
  group: scheduling.platform.example.io
  scope: Cluster
  names:
    plural: nodegroupgrants
    singular: nodegroupgrant
    kind: NodeGroupGrant
    shortNames: [pngg]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Scheduler
      type: string
      jsonPath: .spec.schedulerName
    - name: Source
      type: string
      jsonPath: .spec.source
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Nodes
      type: integer
      jsonPath: .status.resolvedCapacity.nodes
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [schedulerName, version, timestamp, source, nodes]
            properties:
              schedulerName: {type: string, minLength: 1}
              version: {type: string, enum: [v1]}
              timestamp: {type: string, format: date-time}
              source: {type: string, enum: [normal, degraded, disabled]}
              demandRef: {type: string}
              nodes:
                type: array
                minItems: 1
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  required: [name, score]
                  properties:
                    name: {type: string, minLength: 1}
                    score: {type: integer, minimum: 0, maximum: 100}
                    resources:
                      type: object
                      properties:
                        cpuAvailable: {type: string}
                        memoryAvailable: {type: string}
                        throughput5mAvg: {type: string}
                    topology:
                      type: object
                      properties:
                        dataCenter: {type: string}
                        convergenceSwitch: {type: string}
                        accessSwitch: {type: string}
                        subnet: {type: string}
                        rack: {type: string}
                        hops: {type: integer}
                        networkReachable:
                          type: array
                          items: {type: string}
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Active, ReclaimRequested, Draining, Returned]
              resolvedCapacity:
                type: object
                properties:
                  nodes: {type: integer}
                  cpu: {type: string}
                  memory: {type: string}
              consumer:
                type: object
                x-kubernetes-preserve-unknown-fields: true
