apiVersion: v1
kind: ConfigMap
metadata:
  name: ngg-scheduler-config
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: ngg-scheduler
      resourceNamespace: kube-system
    profiles:
    - schedulerName: ngg-scheduler
      plugins:
        filter:
          enabled:
          - name: NodeGroupGrant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngg-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngg-scheduler
  template:
    metadata:
      labels:
        app: ngg-scheduler
    spec:
      serviceAccountName: ngg-scheduler
      containers:
      - name: scheduler
        image: ngg-kube-scheduler:v1.35.3
        imagePullPolicy: IfNotPresent
        args:
        - --config=/etc/ngg-scheduler/config.yaml
        - --v=3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - name: config
          mountPath: /etc/ngg-scheduler
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: ngg-scheduler-config
