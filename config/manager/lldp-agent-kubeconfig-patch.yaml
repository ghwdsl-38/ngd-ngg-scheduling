apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lldp-agent
  namespace: ngd-ngg-system
spec:
  template:
    spec:
      # This patch proves that the Agent uses only the mounted kubeconfig.
      # Keep the ServiceAccount token enabled when an in-cluster fallback is desired.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
      - name: lldp-agent
        args:
        - --timeout=65s
        - --count=0
        - --interval=180s
        - --sys-class-net=/host-sys/class/net
        - --interfaces=bond0
        env:
        - name: KUBECONFIG
          value: /etc/ngd-ngg/kubeconfig
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/ngd-ngg
          readOnly: true
        - name: host-sys
          mountPath: /host-sys
          readOnly: true
      volumes:
      - name: kubeconfig
        secret:
          secretName: lldp-kubeconfig
          defaultMode: 0440
      - name: host-sys
        hostPath:
          path: /sys
          type: Directory
