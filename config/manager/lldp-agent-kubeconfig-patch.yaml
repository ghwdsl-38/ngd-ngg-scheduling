apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lldp-agent
  namespace: ngd-ngg-system
spec:
  template:
    spec:
      # This patch proves that the Agent uses only the mounted kubeconfig.
      # Keep the ServiceAccount token enabled when an in-cluster fallback is desired.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
      - name: lldp-agent
        args:
        - --mode=LLDP
        - --listen-seconds=35
        - --resync-seconds=30
        - --sys-class-net=/host-sys-class-net
        - --kubeconfig=/etc/ngd-ngg/kubeconfig
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/ngd-ngg
          readOnly: true
        - name: host-sys-class-net
          mountPath: /host-sys-class-net
          readOnly: true
      volumes:
      - name: kubeconfig
        secret:
          secretName: lldp-kubeconfig
          defaultMode: 0440
      - name: host-sys-class-net
        hostPath:
          path: /sys/class/net
          type: Directory
