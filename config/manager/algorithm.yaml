apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngd-ngg-algorithm
  namespace: ngd-ngg-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngd-ngg-algorithm
  template:
    metadata:
      labels:
        app: ngd-ngg-algorithm
    spec:
      containers:
      - name: algorithm
        image: ngd-ngg-algorithm:v0.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # 当前 Demo 使用 monitoring 命名空间中的轻量 Prometheus。
        - name: PROMETHEUS_URL
          value: http://prometheus.monitoring.svc.cluster.local:9090
        - name: PROMETHEUS_REFRESH_SECONDS
          value: "15"
        - name: PROMETHEUS_STALE_SECONDS
          value: "120"
        - name: PROMETHEUS_REQUEST_TIMEOUT_SECONDS
          value: "5"
        - name: PROMETHEUS_NODE_LABEL
          value: node
        - name: TOPOLOGY_CONFIG_FILE
          value: /etc/ngd-ngg/topology/topology.yaml
        volumeMounts:
        - name: topology
          mountPath: /etc/ngd-ngg/topology
          readOnly: true
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      volumes:
      - name: topology
        configMap:
          name: ngd-ngg-algorithm-topology
---
apiVersion: v1
kind: Service
metadata:
  name: ngd-ngg-algorithm
  namespace: ngd-ngg-system
spec:
  selector:
    app: ngd-ngg-algorithm
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ngd-ngg-algorithm-topology
  namespace: ngd-ngg-system
data:
  topology.yaml: |
    version: unicom-huabei-huailai-v1
    scopes:
      regions:
        - {id: CN-NORTH, name: 华北}
      locations:
        - {id: HB-HL, name: 怀来, regionId: CN-NORTH}
      dataCenters:
        - {id: HB-HL-DC1, locationId: HB-HL}
      rooms:
        - {id: HB-HL-DC1-102, name: 102机房, dataCenterId: HB-HL-DC1}
    borderDomains:
      HB-HL-DC1-102-BD-A:
        roomId: HB-HL-DC1-102
        mode: active-active
        members: [HB-HL-DC1-102-C03-02U-LTY-CSQ-BORDER-SW01-ZTE9904X, HB-HL-DC1-102-D03-02U-LTY-CSQ-BORDER-SW02-ZTE9904X]
      HB-HL-DC1-102-BD-B:
        roomId: HB-HL-DC1-102
        mode: active-active
        members: [HB-HL-DC1-102-C05-02U-LTY-CSQ-BORDER-SW03-ZTE9904X, HB-HL-DC1-102-D05-02U-LTY-CSQ-BORDER-SW04-ZTE9904X]
      HB-HL-DC1-102-BD-C:
        roomId: HB-HL-DC1-102
        mode: active-active
        members: [HB-HL-DC1-102-C07-02U-LTY-CSQ-BORDER-SW05-ZTE9904X, HB-HL-DC1-102-D07-02U-LTY-CSQ-BORDER-SW06-ZTE9904X]
    leafMetrics:
      switch-a: {bandwidthGbps: 20, latencyMillis: 1.5}
      switch-b: {bandwidthGbps: 10, latencyMillis: 5}
      switch-c: {bandwidthGbps: 25, latencyMillis: 1}
    topology:
      HB-HL-DC1-102:
        switch-a:
          SPINE: {}
          BORDER:
            HB-HL-DC1-102-C03-02U-LTY-CSQ-BORDER-SW01-ZTE9904X: {local_port: cgei-0/1/1/51, peer_port: cgei-0/3/0/9}
            HB-HL-DC1-102-D03-02U-LTY-CSQ-BORDER-SW02-ZTE9904X: {local_port: cgei-0/1/1/53, peer_port: cgei-0/3/0/9}
          LEAF: {}
        switch-b:
          SPINE: {}
          BORDER:
            HB-HL-DC1-102-C05-02U-LTY-CSQ-BORDER-SW03-ZTE9904X: {local_port: cgei-0/1/1/51, peer_port: cgei-0/3/0/9}
            HB-HL-DC1-102-D05-02U-LTY-CSQ-BORDER-SW04-ZTE9904X: {local_port: cgei-0/1/1/53, peer_port: cgei-0/3/0/9}
          LEAF: {}
        switch-c:
          SPINE: {}
          BORDER:
            HB-HL-DC1-102-C07-02U-LTY-CSQ-BORDER-SW05-ZTE9904X: {local_port: cgei-0/1/1/51, peer_port: cgei-0/3/0/9}
            HB-HL-DC1-102-D07-02U-LTY-CSQ-BORDER-SW06-ZTE9904X: {local_port: cgei-0/1/1/53, peer_port: cgei-0/3/0/9}
          LEAF: {}
