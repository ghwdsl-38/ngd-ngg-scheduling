      HB-HL-DC1-102-C04-44U-LTY-CSQ-LEAF-SW02-ZTE5960X: {bandwidthGbps: 20, latencyMillis: 1.5}
    topology:
      HB-HL-DC1-102:
        HB-HL-DC1-102-C03-44U-LTY-CSQ-LEAF-SW01-ZTE5960X:
          SPINE: {}
          BORDER:
            HB-HL-DC1-102-C03-02U-LTY-CSQ-BORDER-SW01-ZTE9904X: {local_port: cgei-0/1/1/51, peer_port: cgei-0/3/0/9}
            HB-HL-DC1-102-D03-02U-LTY-CSQ-BORDER-SW02-ZTE9904X: {local_port: cgei-0/1/1/53, peer_port: cgei-0/3/0/9}
          LEAF:
            HB-HL-DC1-102-C04-44U-LTY-CSQ-LEAF-SW02-ZTE5960X: {local_port: cgei-0/1/1/54, peer_port: cgei-0/1/1/54}
        HB-HL-DC1-102-C04-44U-LTY-CSQ-LEAF-SW02-ZTE5960X:
          SPINE: {}
          BORDER:
            HB-HL-DC1-102-C03-02U-LTY-CSQ-BORDER-SW01-ZTE9904X: {local_port: cgei-0/1/1/51, peer_port: cgei-0/3/0/10}
            HB-HL-DC1-102-D03-02U-LTY-CSQ-BORDER-SW02-ZTE9904X: {local_port: cgei-0/1/1/53, peer_port: cgei-0/3/0/10}
          LEAF:
            HB-HL-DC1-102-C03-44U-LTY-CSQ-LEAF-SW01-ZTE5960X: {local_port: cgei-0/1/1/54, peer_port: cgei-0/1/1/54}
