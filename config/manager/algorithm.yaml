apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngd-ngg-algorithm
  namespace: ngd-ngg-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngd-ngg-algorithm
  template:
    metadata:
      labels:
        app: ngd-ngg-algorithm
    spec:
      containers:
      - name: algorithm
        image: ngd-ngg-algorithm:v0.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # 当前 Demo 使用 monitoring 命名空间中的轻量 Prometheus。
        - name: PROMETHEUS_URL
          value: http://prometheus.monitoring.svc.cluster.local:9090
        - name: PROMETHEUS_REFRESH_SECONDS
          value: "30"
        - name: PROMETHEUS_STALE_SECONDS
          value: "120"
        - name: PROMETHEUS_REQUEST_TIMEOUT_SECONDS
          value: "5"
        - name: PROMETHEUS_NODE_LABEL
          value: node
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ngd-ngg-algorithm
  namespace: ngd-ngg-system
spec:
  selector:
    app: ngd-ngg-algorithm
  ports:
  - name: http
    port: 8080
    targetPort: http
