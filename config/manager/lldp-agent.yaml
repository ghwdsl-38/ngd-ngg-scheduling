apiVersion: v1
kind: ConfigMap
metadata:
  name: ngd-ngg-static-topology
  namespace: ngd-ngg-system
data:
  topology.json: |
    {
      "version": "leaf-border-core-v1",
      "leafSwitches": {
        "switch-a": {"borderSwitchId": "border-a", "bandwidthGbps": 20, "latencyMillis": 1.5},
        "switch-b": {"borderSwitchId": "border-b", "bandwidthGbps": 10, "latencyMillis": 5},
        "switch-c": {"borderSwitchId": "border-c", "bandwidthGbps": 25, "latencyMillis": 1}
      },
      "borderSwitches": {
        "border-a": {"coreSwitchId": "core-0"},
        "border-b": {"coreSwitchId": "core-0"},
        "border-c": {"coreSwitchId": "core-0"}
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lldp-agent
  namespace: ngd-ngg-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 3
  selector:
    matchLabels:
      app: ngd-ngg-lldp-agent
  template:
    metadata:
      labels:
        app: ngd-ngg-lldp-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 5
      serviceAccountName: lldp-agent
      nodeSelector:
        demo.ngg/worker: "true"
      containers:
      - name: lldp-agent
        image: ngd-ngg-lldp-agent:v0.2.0
        imagePullPolicy: IfNotPresent
        args:
        - --mode=Simulated
        - --topology-config=/etc/ngd-ngg/topology.json
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: static-topology
          mountPath: /etc/ngd-ngg
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_RAW"]
      volumes:
      - name: static-topology
        configMap:
          name: ngd-ngg-static-topology
