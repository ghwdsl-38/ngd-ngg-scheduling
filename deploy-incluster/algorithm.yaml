apiVersion: v1
kind: ConfigMap
metadata:
  name: ngd-ngg-algorithm-metrics
  namespace: welkin-system
data:
  prometheus_metrics.json: |
    {
      "version": "node-exporter-network-v1-bupt",
      "nodeLabel": "paas_node_ip",
      "metrics": [
        {
          "name": "cpuUsageRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": true,
          "query": "1 - avg by (paas_node_ip) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))"
        },
        {
          "name": "memoryUsageRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": true,
          "query": "1 - (max by (paas_node_ip) (node_memory_MemAvailable_bytes) / max by (paas_node_ip) (node_memory_MemTotal_bytes))"
        },
        {
          "name": "networkReceiveBytesPerSecond",
          "unit": "bytes_per_second",
          "normalization": "non_negative",
          "required": false,
          "query": "sum by (paas_node_ip) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m]))"
        },
        {
          "name": "networkTransmitBytesPerSecond",
          "unit": "bytes_per_second",
          "normalization": "non_negative",
          "required": false,
          "query": "sum by (paas_node_ip) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m]))"
        },
        {
          "name": "networkReceivePacketsPerSecond",
          "unit": "packets_per_second",
          "normalization": "non_negative",
          "required": false,
          "query": "sum by (paas_node_ip) (rate(node_network_receive_packets_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m]))"
        },
        {
          "name": "networkTransmitPacketsPerSecond",
          "unit": "packets_per_second",
          "normalization": "non_negative",
          "required": false,
          "query": "sum by (paas_node_ip) (rate(node_network_transmit_packets_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m]))"
        },
        {
          "name": "networkReceiveDropRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "clamp_max(sum by (paas_node_ip) (rate(node_network_receive_drop_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])) / clamp_min(sum by (paas_node_ip) (rate(node_network_receive_packets_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])), 1), 1)"
        },
        {
          "name": "networkTransmitDropRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "clamp_max(sum by (paas_node_ip) (rate(node_network_transmit_drop_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])) / clamp_min(sum by (paas_node_ip) (rate(node_network_transmit_packets_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])), 1), 1)"
        },
        {
          "name": "networkReceiveErrorRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "clamp_max(sum by (paas_node_ip) (rate(node_network_receive_errs_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])) / clamp_min(sum by (paas_node_ip) (rate(node_network_receive_packets_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])), 1), 1)"
        },
        {
          "name": "networkTransmitErrorRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "clamp_max(sum by (paas_node_ip) (rate(node_network_transmit_errs_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])) / clamp_min(sum by (paas_node_ip) (rate(node_network_transmit_packets_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])), 1), 1)"
        },
        {
          "name": "tcpRetransmitRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "clamp_max(sum by (paas_node_ip) (rate(node_netstat_Tcp_RetransSegs[5m])) / clamp_min(sum by (paas_node_ip) (rate(node_netstat_Tcp_OutSegs[5m])), 1), 1)"
        },
        {
          "name": "networkLinkUpRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "avg by (paas_node_ip) (node_network_up{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"})"
        },
        {
          "name": "networkUtilizationRatio",
          "unit": "ratio",
          "normalization": "ratio",
          "required": false,
          "query": "clamp_max(sum by (paas_node_ip) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m]) + rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])) / clamp_min(sum by (paas_node_ip) (node_network_speed_bytes{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}), 1), 1)"
        },
        {
          "name": "availableBandwidthBytesPerSecond",
          "unit": "bytes_per_second",
          "normalization": "non_negative",
          "required": false,
          "query": "clamp_min(sum by (paas_node_ip) (node_network_speed_bytes{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}) - sum by (paas_node_ip) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m]) + rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|flannel.*|docker.*|br-.*\"}[5m])), 0)"
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ngd-ngg-algorithm
  namespace: welkin-system
spec:
  selector:
    app: ngd-ngg-algorithm
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngd-ngg-algorithm
  namespace: welkin-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ngd-ngg-algorithm
  template:
    metadata:
      labels:
        app: ngd-ngg-algorithm
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: hl-tstmix7-paasmaster3
      tolerations:
        - effect: NoSchedule
          key: virtual-kubelet.io/provider
          operator: Equal
          value: dubhe
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: algorithm
          image: hlcsq-registry.cucloud.cn/paas/scheduling/algorithm:v0.6.2
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            # 必须改为Algorithm Pod在集群内可以访问的Prometheus地址。
            - name: PROMETHEUS_URL
              value: http://240.5.112.101:8481/select/0/prometheus
            - name: PROMETHEUS_REFRESH_SECONDS
              value: "15"
            - name: PROMETHEUS_STALE_SECONDS
              value: "120"
            - name: PROMETHEUS_REQUEST_TIMEOUT_SECONDS
              value: "5"
            - name: PROMETHEUS_NODE_LABEL
              value: paas_node_ip
            - name: PROMETHEUS_METRICS_CONFIG_FILE
              value: /etc/ngd-ngg/metrics/prometheus_metrics.json
            - name: PROMETHEUS_TLS_SERVER_NAME
              value: ""
            - name: TOPOLOGY_SOURCE_FILE
              value: /etc/ngd-ngg/topology/sw.yaml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: topology
              mountPath: /etc/ngd-ngg/topology
              readOnly: true
            - name: metrics
              mountPath: /etc/ngd-ngg/metrics
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: topology
          configMap:
            name: ngd-ngg-algorithm-topology
        - name: metrics
          configMap:
            name: ngd-ngg-algorithm-metrics
